name: Deploy Social-Pulse to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialpulse-infinityfree-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy website over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
            **/socialpulse_db.sql
            **/.gitignore
            **/config.local.php
            **/config.local.example.php
            **/.env
            **/.env.*
            **/uploads/**/*.jpg
            **/uploads/**/*.jpeg
            **/uploads/**/*.png
            **/uploads/**/*.webp
            **/uploads/**/*.gif
